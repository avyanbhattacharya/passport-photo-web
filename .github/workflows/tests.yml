name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Site metadata and catalog
        run: npm run test:static:site
      - name: Test architecture and hygiene
        run: npm run test:static:hygiene
      - name: Local AI foundation
        run: npm run test:static:local-ai

  chromium:
    name: Deep Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Cache Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.62.1-chromium
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Install Chromium browser on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Core, Japa, and local AI deep tests
        run: npm run test:chromium:core
      - name: PDF deep tests
        run: npm run test:chromium:pdf
      - name: Image and catalog deep tests
        run: npm run test:chromium:image
      - name: Upload Chromium report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  compatibility:
    name: WebKit and iPhone smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Cache WebKit
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.62.1-webkit
      - name: Install WebKit system dependencies
        run: npx playwright install-deps webkit
      - name: Install WebKit browser on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install webkit
      - name: Desktop WebKit smoke
        run: npm run test:compat:webkit
      - name: iPhone WebKit smoke
        run: npm run test:compat:mobile
      - name: Upload compatibility report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-compatibility
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
