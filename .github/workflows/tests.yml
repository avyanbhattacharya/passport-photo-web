name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Site metadata and catalog
        run: npm run test:static:site
      - name: Test architecture and hygiene
        run: npm run test:static:hygiene

  chromium:
    name: Deep Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Core and Japa deep tests
        run: npm run test:chromium:core
      - name: PDF deep tests
        run: npm run test:chromium:pdf
      - name: Image and catalog deep tests
        run: npm run test:chromium:image
      - name: Upload Chromium report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  compatibility:
    name: WebKit and iPhone smoke
    runs-on: ubuntu-latest
    timeout-minutes: 6
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Desktop WebKit smoke
        run: npm run test:compat:webkit
      - name: iPhone WebKit smoke
        run: npm run test:compat:mobile
      - name: Upload compatibility report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-compatibility
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
