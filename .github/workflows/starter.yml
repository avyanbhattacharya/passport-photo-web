name: Starter verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: starter-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: templates/local-web-starter
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run test:static
      - run: npm run build
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-starter-playwright-1.62.1-chromium-webkit
      - run: npx playwright install-deps chromium webkit
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: starter-browser-report
          path: templates/local-web-starter/playwright-report/
          retention-days: 7
